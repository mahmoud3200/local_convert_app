name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            packageKind: windows
            releaseBase: windows-x64
            rustTarget: none
            sidecarTarget: x86_64-pc-windows-msvc
            artifactName: local-convert-windows-x64

          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            packageKind: linux
            releaseBase: linux-x64
            rustTarget: none
            sidecarTarget: x86_64-unknown-linux-gnu
            artifactName: local-convert-linux-x64

          - name: macOS Intel
            platform: macos-13
            args: "--target x86_64-apple-darwin"
            packageKind: macos
            releaseBase: macos-intel
            rustTarget: x86_64-apple-darwin
            sidecarTarget: x86_64-apple-darwin
            artifactName: local-convert-macos-intel

          - name: macOS Apple Silicon
            platform: macos-14
            args: "--target aarch64-apple-darwin"
            packageKind: macos
            releaseBase: macos-apple-silicon
            rustTarget: aarch64-apple-darwin
            sidecarTarget: aarch64-apple-darwin
            artifactName: local-convert-macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        if: matrix.rustTarget == 'none'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.rustTarget != 'none'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare FFmpeg sidecar
        env:
          TAURI_SIDECAR_TARGET_TRIPLE: ${{ matrix.sidecarTarget }}
        run: npm run ffmpeg:setup

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Resolve release label
        id: release_label
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"

          if ($packageVersion -match '^(\d+)\.(\d+)\.0-(.+)$') {
            $releaseLabel = "v$($Matches[1]).$($Matches[2])-$($Matches[3])"
          } else {
            $releaseLabel = "v$packageVersion"
          }

          "packageVersion=$packageVersion" >> $env:GITHUB_OUTPUT
          "releaseLabel=$releaseLabel" >> $env:GITHUB_OUTPUT

      - name: Package release files
        id: package_release_files
        shell: pwsh
        run: |
          $bundleFiles = Get-ChildItem -Path src-tauri/target -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "[\\/]bundle[\\/]" } |
            Sort-Object FullName

          if (-not $bundleFiles) {
            throw "No Tauri bundle files were found under src-tauri/target/**/bundle."
          }

          $releaseDir = Join-Path $env:RUNNER_TEMP "release-files"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $releaseBaseName = "local-convert-${{ steps.release_label.outputs.releaseLabel }}-${{ matrix.releaseBase }}"

          function Copy-BundleFile([string]$pattern, [string]$destinationName) {
            $file = $bundleFiles |
              Where-Object { $_.Name -like $pattern } |
              Select-Object -First 1

            if (-not $file) {
              throw "Could not find a bundle file matching '$pattern'."
            }

            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $releaseDir $destinationName) -Force
          }

          switch ('${{ matrix.packageKind }}') {
            'windows' {
              Copy-BundleFile '*-setup.exe' "$releaseBaseName-setup.exe"
              Copy-BundleFile '*.msi' "$releaseBaseName-installer.msi"
            }
            'linux' {
              Copy-BundleFile '*.AppImage' "$releaseBaseName.AppImage"
              Copy-BundleFile '*.deb' "$releaseBaseName.deb"
              Copy-BundleFile '*.rpm' "$releaseBaseName.rpm"
            }
            'macos' {
              Copy-BundleFile '*.dmg' "$releaseBaseName.dmg"
            }
            default {
              throw "Unsupported package kind: ${{ matrix.packageKind }}"
            }
          }

          Get-ChildItem -Path $releaseDir -File | Select-Object Name, FullName, Length | Format-Table -AutoSize
          "path=$releaseDir" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-${{ steps.release_label.outputs.releaseLabel }}
          path: ${{ steps.package_release_files.outputs.path }}
          if-no-files-found: error
